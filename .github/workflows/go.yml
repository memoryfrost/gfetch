name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache: true

      - name: Build
        run: go build -o gfetch .

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gfetch
          path: gfetch
          retention-days: 30
